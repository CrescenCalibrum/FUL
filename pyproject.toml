[project]
name = "ful-flower-base"
version = "0.1.0"
description = "A minimal Flower-based federated unlearning experiment base with DP prototypes and recovery baselines."
requires-python = ">=3.10,<3.12"
dependencies = [
    "flwr[simulation]==1.8.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fulbase*"]
